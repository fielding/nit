name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos + 0.15.2 is omitted: zig 0.15.2 cannot link against the
        # macOS 26 SDK on current runner images (and current Macs).
        # 0.16 support comes via src/compat.zig.
        include:
          - os: ubuntu-latest
            zig: "0.15.2"
          - os: ubuntu-latest
            zig: "0.16.0"
          - os: macos-latest
            zig: "0.16.0"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install libgit2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2

      - name: Build
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test
        run: |
          git log --oneline -5
          ./zig-out/bin/nit status
          ./zig-out/bin/nit log -n 5
          ./zig-out/bin/nit show

      - name: Conformance tests
        run: ./tests/conformance.sh ./zig-out/bin/nit
