name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        zig: ["0.15.2"]
        include:
          # 0.16-dev is supported via src/compat.zig; informational only
          # since master moves under us.
          - os: ubuntu-latest
            zig: master
          - os: macos-latest
            zig: master

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.zig == 'master' }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install libgit2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: brew install libgit2

      - name: Build
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Smoke test
        run: |
          git log --oneline -5
          ./zig-out/bin/nit status
          ./zig-out/bin/nit log -n 5
          ./zig-out/bin/nit show

      - name: Conformance tests
        run: ./tests/conformance.sh ./zig-out/bin/nit
